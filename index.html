<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noo or Yesss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one chunky card centred on a sunny ground; big tap targets, one screen at a time. */
:root{
  --sun:#FFD84D;
  --ink:#1D1A3B;
  --paper:#FFFFFF;
  --coral:#FF5A4F;
  --leaf:#17A35E;
  --sky:#3A7BFF;
  --grape:#8B4DFF;
  --tangerine:#FF9A1F;
  --bubblegum:#FF5FA8;
  --soft:#FFF1B8;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* without this, .card (display:flex) showed every screen at once */
html,body{min-height:100%}
body{
  background:var(--sun);color:var(--ink);font-family:var(--body);font-weight:600;font-size:18px;line-height:1.4;
  padding-inline:16px;padding-block:20px 40px;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.35) 0 90px,transparent 91px),radial-gradient(circle at 90% 82%,rgba(255,255,255,.28) 0 120px,transparent 121px);
}
main{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(2.6rem,11vw,4.4rem)}
h2{font-size:clamp(1.8rem,7vw,2.6rem)}
p{margin:0}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn{
  background:var(--leaf);color:#fff;border:4px solid var(--ink);border-radius:20px;padding:14px 22px;
  font-family:var(--display);font-size:1.4rem;box-shadow:0 6px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;min-height:60px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.small{font-size:1rem;padding:8px 14px;min-height:44px;box-shadow:0 4px 0 var(--ink);border-width:3px;border-radius:14px}
.btn[disabled]{cursor:default}

/* language switch */
.lang{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lang .btn.small[aria-pressed="true"]{background:var(--ink);color:var(--sun)}

/* level picker and voice picker */
.levels{display:flex;gap:10px;flex-wrap:wrap}
.levels .btn.small[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
#levelLabel{font-weight:800}

/* welcome */
.hero{display:flex;flex-direction:column;gap:10px}
.hero .yes{color:var(--leaf)} .hero .no{color:var(--coral)}
.hero p{max-width:34ch}
label{font-family:var(--display);font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=number]{
  border:4px solid var(--ink);border-radius:18px;padding:14px 16px;font-size:1.5rem;font-weight:800;background:var(--soft);width:100%;min-width:0;
}
.players{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.players span{font-weight:800}
.linkrow{display:flex;gap:10px;flex-wrap:wrap}

/* menu */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stars{font-family:var(--display);font-size:1.4rem;background:var(--ink);color:var(--sun);border-radius:999px;padding:6px 16px;font-variant-numeric:tabular-nums}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.topic{
  display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:4px solid var(--ink);border-radius:22px;
  padding:14px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0;
}
.topic:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.topic:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.tile{flex:none;width:64px;height:64px;border-radius:18px;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:var(--ink)}
.topic b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.1}
.topic small{font-size:.9rem;font-weight:600;opacity:.8}

/* game */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dot.now{background:var(--sun)} .dot.done{background:var(--leaf)}
.prompt{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.visual{
  background:var(--soft);border:4px dashed var(--ink);border-radius:22px;min-height:150px;display:flex;align-items:center;justify-content:center;
  padding:16px;text-align:center;flex-wrap:wrap;gap:6px;overflow-wrap:anywhere;
}
.visual .big{font-size:5rem;line-height:1}
.visual .word{font-family:var(--display);font-size:clamp(2.4rem,11vw,4rem)}
.visual .swatch{width:min(200px,60%);aspect-ratio:1/1;border:5px solid var(--ink);border-radius:30px}
.visual .count{font-size:2.6rem;line-height:1.1}
.visual svg{width:150px;max-width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr;gap:14px}
.voice-answer{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.voice-answer .btn{width:100%;background:var(--sky);color:#fff}
.voice-answer .btn[aria-pressed="true"]{background:var(--coral)}
.voice-answer .btn:disabled{opacity:.6;cursor:default}
.speech-status{min-height:1.4em;font-size:.95rem;font-weight:800;text-align:center}
.speech-status:empty{display:none}
@media (min-width:560px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{
  background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px 10px;min-height:76px;
  font-family:var(--display);font-size:1.7rem;box-shadow:0 6px 0 var(--ink);overflow-wrap:anywhere;
  transition:transform .08s,box-shadow .08s,background .15s;
}
.opt:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink);background:var(--soft)}
.opt.right{background:var(--leaf);color:#fff}
.opt.wrong{background:var(--coral);color:#fff;opacity:.55;box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.opt.shake{animation:shake .4s}
.fb{min-height:84px;display:flex;align-items:center;gap:14px;border-radius:20px;border:4px solid transparent;padding:10px 16px}
.fb[hidden]{display:none}
.fb.yes{background:var(--leaf);color:#fff;border-color:var(--ink);animation:pop .35s}
.fb.no{background:var(--coral);color:#fff;border-color:var(--ink);animation:pop .35s}
.fb .say{font-family:var(--display);font-size:2.4rem;line-height:1}
.fb .sub{font-weight:800}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-8px}80%{translate:8px}}
@keyframes pop{0%{scale:.8}60%{scale:1.06}100%{scale:1}}

/* celebration */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-24px;width:12px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

/* result */
.score{font-family:var(--display);font-size:clamp(2.2rem,10vw,3.4rem);line-height:1}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row .btn{flex:1 1 200px}
.earned{font-size:2.4rem;letter-spacing:4px;overflow-wrap:anywhere}

/* voice recording (for parents) */
.note{background:var(--soft);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-weight:800}
.note[hidden]{display:none}
.group{border:3px solid var(--ink);border-radius:18px;background:var(--paper);overflow:hidden}
.group summary{cursor:pointer;font-family:var(--display);font-size:1.2rem;padding:12px 16px;background:var(--soft)}
.phrases{display:flex;flex-direction:column;gap:12px;padding:14px}
.phrase{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:2px dashed rgba(29,26,59,.25)}
.phrase:last-child{border-bottom:0;padding-bottom:0}
.phrase .txt{font-weight:800;overflow-wrap:anywhere}
.phrase .txt .ok{color:var(--leaf);margin-left:8px}
.phrase .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.small.recbtn{background:var(--coral);color:#fff}
.btn.small.recbtn.on{background:var(--ink);color:var(--sun)}
.filebtn{position:relative;display:inline-flex;align-items:center;font-family:var(--display)}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:4px solid var(--sky);outline-offset:3px}

/* teacher dashboard */
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick .btn.small[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:800}
.tblwrap{overflow-x:auto;border:3px solid var(--ink);border-radius:16px}
.tbl{width:100%;border-collapse:collapse;font-size:1rem;min-width:420px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:2px solid rgba(29,26,59,.2);vertical-align:middle}
.tbl th{background:var(--soft);font-family:var(--display);font-weight:400}
.tbl tr:last-child td{border-bottom:0}
.badge{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.badge.new{background:var(--paper)}
.badge.start{background:var(--soft)}
.badge.strong{background:var(--leaf);color:#fff}
.badge.ok{background:var(--sky);color:#fff}
.badge.practice{background:var(--coral);color:#fff}
.hist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.alertline{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-weight:800;background:var(--soft)}
.alertline.warn{background:var(--coral);color:#fff}
.tdash-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.tdash-stat{border:3px solid var(--ink);border-radius:16px;padding:12px;background:var(--soft);min-width:0}
.tdash-stat strong{display:block;font-family:var(--display);font-size:1.8rem;font-weight:400;line-height:1.1;overflow-wrap:anywhere}
.tdash-stat span{display:block;font-size:.92rem;font-weight:800}
.tdash-actions{display:flex;gap:10px;flex-wrap:wrap}

/* kid home screen */
.who{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{font-size:3.4rem;line-height:1;background:var(--soft);border:4px solid var(--ink);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;flex:none}
.homebtns{display:grid;gap:20px}
.bigbtn{display:flex;align-items:center;gap:18px;border:5px solid var(--ink);border-radius:32px;padding:22px 24px;box-shadow:0 10px 0 var(--ink);color:#fff;text-align:left;min-height:160px;transition:transform .08s,box-shadow .08s}
.bigbtn:hover{transform:translateY(-3px);box-shadow:0 13px 0 var(--ink)}
.bigbtn:active{transform:translateY(8px);box-shadow:0 2px 0 var(--ink)}
.bigbtn .bi{font-size:5.5rem;line-height:1;flex:none}
.bigbtn .bt{font-family:var(--display);font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.05}
.b-tap{background:var(--bubblegum)}
.b-games{background:var(--sky)}
.homefoot{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.players .btn{font-size:1.4rem;min-height:60px}
.topics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.topic{flex-direction:column;text-align:center;padding:18px 10px;gap:10px}
.topic .tile{width:96px;height:96px;font-size:3.4rem;border-radius:26px}
.topic small{display:none}
#speakBtn,#muteBtn,#backBtn,#gamesBack,#gruBack,#gateBack{font-size:1.7rem;min-width:56px;min-height:56px}
#micBtn{font-size:2.4rem}
.gsec{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:3px dashed rgba(29,26,59,.25)}
.gsec:last-child{border-bottom:0}
.gsec h3{font-size:1.3rem}
#gateMsg[hidden]{display:none}

/* tap and hear (no reading needed) */
.tapbtn{width:100%;font-size:1.6rem;background:var(--bubblegum)}
.tappick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.tappick[hidden]{display:none}
.tappick .btn{font-size:3.4rem;min-height:120px;padding:10px;line-height:1}
.tapcard{background:var(--soft);border:5px dashed var(--ink);border-radius:30px;min-height:min(60vh,380px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;animation:wiggle 1.6s ease-in-out infinite;padding:16px;overflow-wrap:anywhere}
.tapcard[hidden]{display:none}
.tapcard span{display:block}
.tapcard.hit{animation:boing .6s}
.tapcard .tbig{font-size:clamp(6rem,38vw,11rem);line-height:1;font-family:var(--display)}
.tapcard .tsub{font-size:3rem;line-height:1.1}
.tapcard .tname{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);line-height:1.1;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:4px 20px;margin-top:4px}
.tapcard .tsw{width:min(240px,70%);aspect-ratio:1/1;border:6px solid var(--ink);border-radius:36px}
.tapcard svg{width:min(240px,70%);height:auto}
@keyframes wiggle{0%,100%{rotate:0deg;scale:1}25%{rotate:-2deg;scale:1.02}75%{rotate:2deg;scale:1.02}}
@keyframes boing{0%{scale:1}30%{scale:1.15}60%{scale:.94}100%{scale:1}}
.spark{position:fixed;font-size:2rem;pointer-events:none;z-index:60;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--sx),var(--sy)) scale(1.4);opacity:0}}
.tapend{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.tapend[hidden]{display:none}
.tapend .row{width:100%}

/* full-screen play: only the activity and a back button */
body.fs{padding:0}
body.fs main{max-width:none;gap:0;min-height:100dvh}
body.fs .card{border:0;border-radius:0;box-shadow:none;min-height:100dvh;padding:14px 14px 24px;background:transparent}
body.fs .bar .stars,body.fs .bar .dots{display:none}
#game h2#prompt{font-size:clamp(1.4rem,6vw,2rem)}
#game .visual{flex:1;min-height:200px}
#game .opt{min-height:100px;font-size:2rem}
#micBtn[aria-pressed="true"]{background:var(--coral);color:#fff}
#tap .tappick{flex:1;align-content:center}
#tap .tapcard{flex:1;min-height:55dvh}
#tap .tapend{flex:1;justify-content:center}
#games .topics{flex:1;align-content:center}
#games h2{display:none}
#menu .homebtns{flex:1;grid-template-rows:1fr 1fr}
#menu .bigbtn{min-height:0}
#result{justify-content:center}

/* grown-ups side bar */
#menuToggle{position:fixed;top:10px;right:10px;z-index:40;width:46px;height:46px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-size:1.5rem;line-height:1;opacity:.85;box-shadow:0 3px 0 var(--ink)}
#scrim{position:fixed;inset:0;background:rgba(29,26,59,.55);z-index:70}
#scrim:not(.open){display:none}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,90vw);background:var(--paper);border-right:5px solid var(--ink);z-index:80;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s}
#drawer.open{transform:none;visibility:visible}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti,.spark{display:none}}
</style>
</head>
<body>
<main>
  <!-- WELCOME -->
  <section id="welcome" class="card">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
    </div>
    <form id="nameForm" class="field" autocomplete="off">
      <label for="nameInput" id="nameLabel"></label>
      <input id="nameInput" type="text" maxlength="20" required>
      <button class="btn" type="submit" id="playBtn"></button>
    </form>
    <div id="players" class="players" hidden></div>
    <button class="btn tapbtn" id="tapGuest" type="button"></button>
  </section>

  <!-- HOME: only big pictures -->
  <section id="menu" class="card" hidden>
    <div class="bar">
      <div class="who"><div class="avatar" id="avatar"></div><h2 id="hello"></h2></div>
      <div class="stars" id="menuStars">⭐ 0</div>
    </div>
    <div class="homebtns">
      <button class="bigbtn b-tap" id="tapOpen" type="button"><span class="bi">👆</span><span class="bt" id="tapOpenText"></span></button>
      <button class="bigbtn b-games" id="gamesOpen" type="button"><span class="bi">🎯</span><span class="bt" id="gamesOpenText"></span></button>
    </div>
  </section>

  <!-- QUIZ GAMES: pick a topic by picture -->
  <section id="games" class="card" hidden>
    <div class="bar">
      <button class="btn alt small" id="gamesBack" type="button">🏠</button>
      <div class="stars" id="gamesStars">⭐ 0</div>
    </div>
    <h2 id="chooseText"></h2>
    <div class="topics" id="topics"></div>
  </section>

  <!-- GATE: keeps small children out of the grown-ups area -->
  <section id="gate" class="card" hidden>
    <div class="bar"><button class="btn alt small" id="gateBack" type="button">🏠</button></div>
    <h2 id="gateTitle"></h2>
    <p id="gateHelp"></p>
    <form id="gateForm" class="field" autocomplete="off">
      <label for="gateInput" id="gateQ"></label>
      <input id="gateInput" type="number" inputmode="numeric" required>
      <button class="btn" type="submit" id="gateGo"></button>
    </form>
    <p id="gateMsg" class="alertline warn" hidden></p>
  </section>

  <!-- GAME: full screen, only the question and a few icon buttons -->
  <section id="game" class="card" hidden>
    <div class="bar">
      <button class="btn alt small" id="backBtn" type="button"></button>
      <button class="btn alt small" id="speakBtn" type="button"></button>
      <button class="btn alt small" id="micBtn" type="button" aria-pressed="false">🎤</button>
      <div class="dots" id="dots"></div>
      <div class="stars" id="gameStars">⭐ 0</div>
    </div>
    <h2 id="prompt"></h2>
    <p id="speechStatus" class="speech-status" role="status" aria-live="polite"></p>
    <div class="visual" id="visual"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden role="status" aria-live="polite"><div class="say" id="say"></div><div class="sub" id="sub"></div></div>
    <button class="btn" id="nextBtn" type="button" hidden></button>
  </section>

  <!-- RESULT -->
  <section id="result" class="card" hidden>
    <h2 id="resTitle"></h2>
    <div class="score" id="resScore"></div>
    <div class="earned" id="resStars" aria-hidden="true"></div>
    <p id="resMsg"></p>
    <div class="row">
      <button class="btn" id="againBtn" type="button"></button>
      <button class="btn alt" id="menuBtn" type="button"></button>
    </div>
  </section>

  <!-- TAP AND HEAR -->
  <section id="tap" class="card" hidden>
    <div class="bar">
      <button class="btn alt small" id="tapBack" type="button">🏠</button>
      <div class="dots" id="tapDots"></div>
      <div class="stars" id="tapStars">⭐ 0</div>
    </div>
    <div class="tappick" id="tapPick"></div>
    <button class="tapcard" id="tapCard" type="button" hidden></button>
    <div class="tapend" id="tapEnd" hidden>
      <div class="earned" id="tapEndStars" aria-hidden="true"></div>
      <div class="row">
        <button class="btn" id="tapAgain" type="button">🔁</button>
        <button class="btn alt" id="tapHome" type="button">🏠</button>
      </div>
    </div>
  </section>

  <!-- RECORD YOUR VOICE -->
  <section id="record" class="card" hidden>
    <div class="bar">
      <button class="btn alt small" id="recBack" type="button"></button>
      <div class="lang" role="group" aria-label="Language">
        <button class="btn alt small" type="button" data-lang="en" aria-pressed="true">English</button>
        <button class="btn alt small" type="button" data-lang="sw" aria-pressed="false">Kiswahili</button>
      </div>
    </div>
    <h2 id="recTitle"></h2>
    <p id="recHelp"></p>
    <div class="note" id="recNote" hidden role="status" aria-live="polite"></div>
    <div id="recGroups" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- TEACHER DASHBOARD -->
  <section id="teacher" class="card" hidden>
    <div class="bar">
      <button class="btn alt small" id="tBack" type="button"></button>
      <div class="lang" role="group" aria-label="Language">
        <button class="btn alt small" type="button" data-lang="en" aria-pressed="true">English</button>
        <button class="btn alt small" type="button" data-lang="sw" aria-pressed="false">Kiswahili</button>
      </div>

  function T(){return TXT[lang]}

  }
  function pickOne(a){return a[Math.floor(Math.random()*a.length)]}
  function L(entry){return entry[lang==='sw'?1:0]}   /* choose the English or Swahili word of a pair */

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function others(pool,correct,n){return shuffle(pool.filter(function(x){return String(x).toLowerCase()!==String(correct).toLowerCase()})).slice(0,n)}
  function uniq(a){var seen={},out=[];a.forEach(function(x){if(!seen[x]){seen[x]=1;out.push(x)}});return out}

  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function near(a){
    var ds=a<=10?[-2,-1,1,2,3]:[-10,-2,-1,1,2,10];

  }
  function mathQ(lv){
    var op,a,b,ans;
    if(lv==='pg'){op='+';a=rnd(1,2);b=rnd(1,2)}
    else if(lv==='pp1'){op='+';a=rnd(1,3);b=rnd(1,3)}
    else if(lv==='pp2'){op='+';a=rnd(1,5);b=rnd(1,5)}
    else if(lv==='g1'){
      if(Math.random()<.6){op='+';a=rnd(1,9);b=rnd(1,10-a)}
      else{op='-';a=rnd(2,10);b=rnd(1,a-1)}
    }else if(lv==='g2'){
      if(Math.random()<.5){op='+';a=rnd(10,30);b=rnd(5,20)}
      else{op='-';a=rnd(15,50);b=rnd(5,a-5)}
    }else{
      var r=Math.random();
      if(r<.4){op='×';a=pickOne([2,3,4,5,10]);b=rnd(1,10)}
      else if(r<.7){op='+';a=rnd(20,60);b=rnd(10,40)}
      else{op='-';a=rnd(30,100);b=rnd(10,a-10)}
    }
    ans=op==='+'?a+b:op==='-'?a-b:a*b;
    var visual;
    if(lv==='pg'||lv==='pp1'||lv==='pp2'){
      var t=pickOne(THINGS),x='',y='';
      for(var i=0;i<a;i++)x+=t;
      for(var j=0;j<b;j++)y+=t;
      visual='<div class="count">'+x+' + '+y+'</div>';
    }else visual={text:a+' '+op+' '+b};
    var spoken=a+' '+T().ops[op]+' '+b+'?';
    return mk(T().q.math,visual,ans,near(ans),spoken);
  }
  function paintLevels(){
    var box=$('#levels');box.innerHTML='';$('#levelSec').hidden=!state.name;
    if(!state.name)return;
    LEVELS.forEach(function(k){
      var b=document.createElement('button');b.type='button';b.className='btn alt small';
      b.textContent=T().levels[k];
      b.setAttribute('aria-pressed',level()===k?'true':'false');
      b.addEventListener('click',function(){
        players[state.name]=players[state.name]||{stars:0};
        players[state.name].level=k;store.set(players);paintLevels();
      });
      box.appendChild(b);
    });
  }

  var TOPICS=[
    {id:'name',tile:'🙋',color:'var(--coral)',
      build:function(name){
        var letters=name.replace(/\s/g,'');
        var first=letters.charAt(0).toUpperCase();
        var last=letters.charAt(letters.length-1).toUpperCase();
        var q=T().q;
        var t=tier();
        var out=[
          mk(q.name,'<div class="big">🤔</div>',name,DECOY_NAMES,q.name,'q:name'),
          mk(q.first,{text:name},first,ALPHA,q.first,'q:first')
        ];
        if(t>=1)out.push(mk(q.count,{text:name},letters.length,NUMS,q.count,'q:count'));
        if(t>=2&&letters.length>1)out.push(mk(q.last,{text:name},last,ALPHA,q.last,'q:last'));
        return out;
      }},
    {id:'colors',tile:'🎨',color:'var(--grape)',
      build:function(){
        var pool=COLORS.slice(0,byTier([4,7,10]));
        var names=pool.map(L);

          return mk(q,'<div class="swatch" style="background:'+c[2]+'"></div>',L(c),names,q,'q:color');
        });
      }},

      build:function(){
        var pool=ANIMALS.slice(0,byTier([5,8,10]));

  /* ---------- recorded voice clips, kept in this browser (IndexedDB). Key = language + '|' + clip id ---------- */
  var clips={};

  /* ---------- sound ---------- */
  var ctx=null;
  var muted=false;
  try{muted=localStorage.getItem('nooyesss:muted')==='1'}catch(e){}
  function tone(freqs,dur){
    if(muted)return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      var t=ctx.currentTime;
      freqs.forEach(function(f,i){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t+i*dur);
        g.gain.exponentialRampToValueAtTime(0.25,t+i*dur+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+i*dur+dur);
        o.connect(g);g.connect(ctx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+0.02);
      });
    }catch(e){}
  }
  var pending=null;
  var voiceToken=0;
  var curAudio=null;
  /* Browsers do not say whether a voice is male or female, so the voice name is checked against common names. */
  var FEM=/female|woman|zira|samantha|susan|hazel|karen|moira|tessa|victoria|fiona|aria|jenny|libby|sonia|natasha|catherine|heather|linda|emma|amy|ava|allison|joanna|kendra|kimberly|salli|ivy|zuzana|serena/i;
  var MAL=/male|david|mark|daniel|alex|fred|george|guy|ryan|james|richard|thomas|rishi|aaron|arthur|gordon|oliver/i;
  function findVoice(prefix){
    try{
      var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(prefix)===0});
      if(!vs.length)return null;
      var pick=vs.filter(function(v){
        var f=FEM.test(v.name);
        return vg==='f'?f:(!f&&MAL.test(v.name));
      });
      return pick[0]||vs[0];
    }catch(e){}
    return null;
  }
  function once(fn){var d=false;return function(){if(d)return;d=true;fn()}}
  function stopClip(){
    if(curAudio){
      try{curAudio.onended=null;curAudio.onerror=null;curAudio.pause()}catch(e){}
      curAudio=null;
    }
  }
  function playClip(url,cb){
    var done=once(cb);
    try{
      var a=new Audio(url);
      curAudio=a;
      a.onended=done;a.onerror=done;
      var p=a.play();
      if(p&&p.catch)p.catch(done);
      setTimeout(done,15000);
    }catch(e){done()}
  }
  function speakText(text,pitch,rate,cb){
    var done=once(cb);
    if(!text||!('speechSynthesis' in window)){setTimeout(done,300);return}
    try{
      var u=new SpeechSynthesisUtterance(String(text));
      u.lang=T().voice;
      var v=findVoice(T().voicePrefix);
      if(v)u.voice=v;
      u.rate=rate||0.85;
      u.pitch=Math.max(0.1,Math.min(2,(pitch||1.2)*(vg==='m'?0.7:1)));
      u.volume=1;
      u.onend=done;u.onerror=done;
      speechSynthesis.speak(u);
      setTimeout(done,8000);
    }catch(e){setTimeout(done,300)}
  }
  /* say(items, {rate, onend, fallback}) plays each item in turn. An item is a string, or {k: clip id, t: text, pitch}.
     A recorded clip is used when there is one; otherwise the phone voice reads the text. */
  function say(items,opt){
    opt=opt||{};
    var token=++voiceToken;
    var finished=false;
    function fin(){if(finished)return;finished=true;if(opt.onend&&token===voiceToken)opt.onend()}
    var list=(Array.isArray(items)?items:[items]).map(function(it){return typeof it==='string'?{t:it}:it});
    stopClip();
    try{speechSynthesis.cancel()}catch(e){}
    if(muted){setTimeout(fin,opt.fallback||1500);return}
    var i=0;
    function next(){
      if(token!==voiceToken)return;
      if(i>=list.length){fin();return}
      var it=list[i++];
      var url=clipUrl(it.k);
      if(url)playClip(url,next);
      else speakText(it.t,it.pitch||opt.pitch,opt.rate,next);
    }
    next();
    setTimeout(fin,opt.fallback||9000);
  }
  function stopVoice(){
    voiceToken++;
    if(pending){clearTimeout(pending);pending=null}
    stopClip();
    try{speechSynthesis.cancel()}catch(e){}
  }

  /* happy crowd cheer: a rising run of notes plus a burst of clapping-like noise */
  function cheer(){
    if(muted)return;
    tone([523,659,784,1047,1319,1568],0.08);
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      var len=Math.floor(ctx.sampleRate*1.1);
      var buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++){
        var clap=(Math.floor(i/(ctx.sampleRate*0.07))%2===0)?1:0.45;
        d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.4)*clap;
      }
      var src=ctx.createBufferSource();src.buffer=buf;
      var f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=0.7;
      var g=ctx.createGain();g.gain.value=0.45;
      src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();
    }catch(e){}
  }

  /* takes n items, using every item once before any item comes back */
  function takeTap(key,list,n){

      if(!bag.length)bag=shuffle(list);

  function buildTap(cat){
    var out=[],p=players[state.name]||{};
    if(cat==='numbers'){
      /* counts 1 to 100, ten at a time; the next round carries on where the child stopped */
      var start=p.tapNum||1;
      if(start>100)start=1;
      for(var k=start;k<start+10&&k<=100;k++){
        var th=THINGS[k%THINGS.length],sub='';
        if(k<=20){for(var j=0;j<k;j++){sub+=th;if((j+1)%5===0&&j+1<k)sub+='<br>'}}
        else{
          var tens=Math.floor(k/10),ones=k%10;
          for(var a=0;a<tens;a++)sub+='🔟';
          if(ones){sub+='<br>';for(var b=0;b<ones;b++)sub+=th}
        }
        out.push({html:tcard(k,sub,numWord(k)),say:[{k:optKey(k),t:numWord(k)}]});
      }

      /* the alphabet in order, eight letters at a time */

  function speechStatus(message){

  function stopListening(clearMessage){

  function speechNormalize(value){
    return String(value==null?'':value).toLocaleLowerCase(lang==='sw'?'sw-KE':'en-US')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function spokenAliases(value){
    var n=speechNormalize(value), aliases=[n];
    var enNums={zero:'0',one:'1',won:'1',two:'2',to:'2',too:'2',three:'3',four:'4',for:'4',five:'5',six:'6',seven:'7',eight:'8',ate:'8',nine:'9',ten:'10',eleven:'11',twelve:'12'};
    var swNums={sifuri:'0',moja:'1',mbili:'2',tatu:'3',nne:'4',tano:'5',sita:'6',saba:'7',nane:'8',tisa:'9',kumi:'10'};
    var nums=lang==='sw'?swNums:enNums;
    if(nums[n]!==undefined)aliases.push(nums[n]);
    if(/^\d+$/.test(n)){
      var enBack={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve'};
      var swBack={'0':'sifuri','1':'moja','2':'mbili','3':'tatu','4':'nne','5':'tano','6':'sita','7':'saba','8':'nane','9':'tisa','10':'kumi'};
      var back=lang==='sw'?swBack:enBack;
      if(back[n])aliases.push(back[n]);
    }
    var lettersEn={a:['a','ay'],b:['b','bee','be'],c:['c','see','sea'],d:['d','dee'],e:['e'],f:['f','eff'],g:['g','gee'],h:['h','aitch'],i:['i','eye'],j:['j','jay'],k:['k','kay'],l:['l','ell'],m:['m','em'],n:['n','en'],o:['o','oh'],p:['p','pee'],q:['q','cue'],r:['r','are'],s:['s','ess'],t:['t','tee'],u:['u','you'],v:['v','vee'],w:['w','double u'],x:['x','ex'],y:['y','why'],z:['z','zee','zed']};
    if(n.length===1&&/[a-z]/.test(n)){
      (lettersEn[n]||[]).forEach(function(a){aliases.push(a)});
    }
    return aliases;
  }
  function sameSpokenAnswer(spoken,option){
    var a=spokenAliases(spoken),b=spokenAliases(option);
    return a.some(function(x){return b.indexOf(x)>=0});
  }
  function beginListening(){
    if(state.locked||!state.topic)return;
    var API=speechApi();
    if(!API){speechStatus(T().micUnsupported);return}
    stopListening(true);
    stopVoice();   /* so the phone does not hear its own voice reading the question */
    var attempt=++speechAttempt;
    try{
      var recSpeech=new API();
      recognition=recSpeech;
      recSpeech.lang=lang==='sw'?'sw-KE':'en-US';
      recSpeech.continuous=false;
      recSpeech.interimResults=false;
      recSpeech.maxAlternatives=5;
      listening=true;
      paintMicButton();
      speechStatus(T().micListening);
      recSpeech.onresult=function(event){
        if(attempt!==speechAttempt||state.locked)return;
        var q=state.qs[state.i], alternatives=[];
        var result=event.results&&event.results[0];
        if(result){
          for(var i=0;i<result.length;i++){
            var transcript=(result[i].transcript||'').trim();
            if(transcript)alternatives.push(transcript);
          }
        }
        var matched=null;
        for(var j=0;j<alternatives.length&&!matched;j++){
          matched=q.opts.find(function(opt){return sameSpokenAnswer(alternatives[j],opt)})||null;
        }
        stopListening(false);
        if(matched!==null){
          speechStatus(fill(T().micMatched,{a:matched}));
          var btn=Array.prototype.find.call(document.querySelectorAll('.opt'),function(b){return b.textContent===matched});
          if(btn)answer(btn,matched);
        }else{
          speechStatus(T().micNoMatch);
        }
      };
      recSpeech.onerror=function(event){
        if(attempt!==speechAttempt)return;
        stopListening(false);
        if(event&&(event.error==='not-allowed'||event.error==='service-not-allowed')){
          speechStatus(T().micDenied);
        }else if(event&&event.error==='no-speech'){
          speechStatus(T().micNoMatch);
        }else{
          speechStatus(T().micError);
        }
      };
      recSpeech.onend=function(){
        if(attempt!==speechAttempt)return;
        if(listening){
          listening=false;recognition=null;paintMicButton();
          if(!$('#speechStatus').textContent)speechStatus(T().micNoMatch);
        }
      };
      recSpeech.start();
    }catch(e){
      stopListening(false);
      speechStatus(T().micError);
    }
  }

  function renderRecord(){

      var have=g.items.filter(function(it){return hasClip(it.k)}).length;
      var d=document.createElement('details');d.className='group';

      g.items.forEach(function(it){
        var row=document.createElement('div');row.className='phrase';
        var tx=document.createElement('div');tx.className='txt';tx.textContent=it.t;
        if(hasClip(it.k)){var ok=document.createElement('span');ok.className='ok';ok.textContent='✓ '+x.done;tx.appendChild(ok)}

        var play=document.createElement('button');play.type='button';play.className='btn alt small';play.textContent='▶ '+x.play;
        play.addEventListener('click',function(){say([{k:it.k,t:it.t}],{rate:0.9,fallback:8000})});
        acts.appendChild(play);

        var on=rec&&rec.id===it.k;
        var rb=document.createElement('button');rb.type='button';rb.className='btn small recbtn'+(on?' on':'');
        rb.textContent=on?'⏹ '+x.stop:'🎙 '+x.rec;

        fl.appendChild(document.createTextNode('📁 '+x.file));
        var inp=document.createElement('input');inp.type='file';inp.accept='audio/*';
        inp.addEventListener('change',function(){addFile(it.k,inp.files&&inp.files[0]);inp.value=''});
        fl.appendChild(inp);
        acts.appendChild(fl);

        if(hasClip(it.k)){
          var del=document.createElement('button');del.type='button';del.className='btn alt small';del.textContent='🗑 '+x.del;
          del.addEventListener('click',function(){deleteClip(it.k);showNote('');renderRecord()});
          acts.appendChild(del);
        }
        row.appendChild(tx);row.appendChild(acts);list.appendChild(row);
      });
      d.appendChild(list);
      box.appendChild(d);
    });
  }

  function openRecord(){
    stopListening(true);stopVoice();showNote('');show('record');renderRecord()}
  function closeRecord(){stopRec();stopVoice();show(state.name?'menu':'welcome');openDrawer()}

  /* ---------- teacher dashboard ---------- */
  function fmtDate(ts){
    try{return new Date(ts).toLocaleDateString(lang==='sw'?'sw-KE':'en-GB',{day:'numeric',month:'short'})}catch(e){return ''}
  }
  function pct(r){return r.asked?Math.round(100*r.first/r.asked):0}
  /* status from first-try accuracy: needs at least 3 answers before judging */
  function statusOf(r){
    if(!r||!r.asked)return 'new';
    if(r.asked<3)return 'start';
    var p=pct(r);
    return p>=85?'strong':p>=60?'ok':'practice';
  }
  var STATUS_KEY={new:'sNew',start:'sStart',strong:'sStrong',ok:'sOk',practice:'sPractice'};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

  function csvCell(value){
    var s=String(value==null?'':value);
    return '"' + s.replace(/"/g,'""') + '"';
  }
  function downloadCSV(filename, rows){
    var csv='\uFEFF'+rows.map(function(row){return row.map(csvCell).join(',')}).join('\r\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }
  function xLevelName(lv){return T().levels[lv]||lv}
  function levelOf(p){
    var lv=p.level==='pp'||!p.level?'pp1':p.level;
    return LEVELS.indexOf(lv)<0?'pp1':lv;
  }
  function childReportRows(name){
    var p=players[name]||{},prog=p.prog||{};
    var lv=levelOf(p);
    var rows=[
      [lang==='sw'?'Jina':'Child',name],
      [T().tLevel,xLevelName(lv)],
      [T().tStars,p.stars||0],
      [],
      [T().tTopic,T().tRounds,T().tFirst,T().tStatus]
    ];
    TOPICS.forEach(function(t){
      var r=prog[t.id]||{asked:0,first:0,rounds:0};
      rows.push([T().t[t.id][0],r.rounds||0,r.asked?(r.first+'/'+r.asked+' ('+pct(r)+'%)'):'',T()[STATUS_KEY[statusOf(r)]]]);
    });
    rows.push([]);
    rows.push([T().tRecent,T().tTopic,T().tLevel,T().tFirst,'Total']);
    (p.hist||[]).slice(0,30).forEach(function(h){
      var hlevel=h.level==='pp'?'pp1':h.level;
      rows.push([fmtDate(h.t),T().t[h.topic]?T().t[h.topic][0]:h.topic,xLevelName(hlevel),h.first,h.total]);
    });
    return rows;
  }
  function exportClassReport(){
    var rows=[[lang==='sw'?'Mtoto':'Child',T().tLevel,T().tStars,T().tTopic,T().tRounds,T().tFirst,T().tStatus]];
    Object.keys(players).forEach(function(name){
      var p=players[name]||{},prog=p.prog||{},lv=levelOf(p);
      TOPICS.forEach(function(t){
        var r=prog[t.id]||{asked:0,first:0,rounds:0};
        rows.push([name,xLevelName(lv),p.stars||0,T().t[t.id][0],r.rounds||0,r.asked?(r.first+'/'+r.asked+' ('+pct(r)+'%)'):'',T()[STATUS_KEY[statusOf(r)]]]);
      });
    });
    downloadCSV('noo-or-yesss-class-report.csv',rows);
  }

  function renderTeacher(){
    var x=T();
    var names=Object.keys(players);
    var pick=$('#tPick'),body=$('#tBody');
    pick.innerHTML='';body.innerHTML='';
    if(!names.length){body.appendChild(el('p','',x.tNone));return}
    if(names.indexOf(tsel)<0)tsel=(state.name&&players[state.name])?state.name:names[0];
    names.forEach(function(n){
      var b=el('button','btn alt small',n);b.type='button';
      b.setAttribute('aria-pressed',n===tsel?'true':'false');
      b.addEventListener('click',function(){tsel=n;renderTeacher()});
      pick.appendChild(b);
    });

    var p=players[tsel];
    var prog=p.prog||{};
    var lv=levelOf(p);

    /* quick facts */
    var lastTs=0;Object.keys(prog).forEach(function(k){if(prog[k].last>lastTs)lastTs=prog[k].last});
    var facts=el('div','facts');
    facts.appendChild(el('span','fact',x.tLevel+': '+x.levels[lv]));
    facts.appendChild(el('span','fact','⭐ '+(p.stars||0)));
    facts.appendChild(el('span','fact',x.tLast+': '+(lastTs?fmtDate(lastTs):x.tNever)));
    var capNow=(p.cap&&p.cap[lv])||NUMCAP[lv].start;
    facts.appendChild(el('span','fact',fill(x.tCount,{c:capNow})));
    body.appendChild(facts);

    /* at-a-glance learning totals */
    var totalRounds=0,totalAsked=0,totalFirst=0;
    Object.keys(prog).forEach(function(k){
      var r=prog[k]||{};
      totalRounds+=Number(r.rounds)||0;
      totalAsked+=Number(r.asked)||0;
      totalFirst+=Number(r.first)||0;
    });
    var overview=el('div','tdash-summary');
    [[x.tTotalRounds,totalRounds],[x.tTotalAnswers,totalAsked],[x.tAccuracy,totalAsked?Math.round(totalFirst/totalAsked*100)+'%':'—']].forEach(function(item){
      var card=el('div','tdash-stat');
      card.appendChild(el('strong','',String(item[1])));
      card.appendChild(el('span','',item[0]));
      overview.appendChild(card);
    });
    body.appendChild(el('h3','',x.tOverview));
    body.appendChild(overview);

    var actions=el('div','tdash-actions');
    var exportOne=el('button','btn alt small',x.tExportChild);
    exportOne.type='button';
    exportOne.addEventListener('click',function(){
      var safeName=tsel.toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'')||'child';
      downloadCSV('noo-or-yesss-'+safeName+'.csv',childReportRows(tsel));
    });
    var exportAll=el('button','btn alt small',x.tExportClass);
    exportAll.type='button';exportAll.addEventListener('click',exportClassReport);
    actions.appendChild(exportOne);actions.appendChild(exportAll);body.appendChild(actions);

    /* topics that need practice */
    var weak=TOPICS.filter(function(t){return statusOf(prog[t.id])==='practice'}).map(function(t){return x.t[t.id][0]});
    body.appendChild(el('div','alertline'+(weak.length?' warn':''),weak.length?fill(x.tPracticeList,{l:weak.join(', ')}):x.tAllGood));

    /* per-topic table */
    var wrap=el('div','tblwrap'),tbl=el('table','tbl');
    var thead=el('thead'),hr=el('tr');
    [x.tTopic,x.tRounds,x.tFirst,x.tStatus].forEach(function(h){var th=el('th','',h);th.scope='col';hr.appendChild(th)});
    thead.appendChild(hr);tbl.appendChild(thead);
    var tb=el('tbody');
    TOPICS.forEach(function(t){
      var r=prog[t.id]||{asked:0,first:0,rounds:0};
      var st=statusOf(r);
      var tr=el('tr');
      tr.appendChild(el('td','',x.t[t.id][0]));
      tr.appendChild(el('td','',String(r.rounds||0)));
      tr.appendChild(el('td','',r.asked?r.first+'/'+r.asked+' ('+pct(r)+'%)':'–'));
      var td=el('td');td.appendChild(el('span','badge '+st,x[STATUS_KEY[st]]));
      tr.appendChild(td);tb.appendChild(tr);
    });
    tbl.appendChild(tb);wrap.appendChild(tbl);body.appendChild(wrap);

    /* recent rounds */
    body.appendChild(el('h3','',x.tRecent));
    var hist=p.hist||[];
    if(!hist.length)body.appendChild(el('p','',x.tNoRecent));
    else{
      var ul=el('ul','hist');
      hist.slice(0,8).forEach(function(h){
        var lvl=h.level==='pp'?'pp1':h.level;
        var tn=x.t[h.topic]?x.t[h.topic][0]:h.topic;
        ul.appendChild(el('li','',fmtDate(h.t)+' · '+tn+' · '+(x.levels[lvl]||'')+' · '+h.first+'/'+h.total));
      });
      body.appendChild(ul);
    }

    var rs=el('button','btn alt small',x.tReset);rs.type='button';rs.style.alignSelf='flex-start';
    rs.addEventListener('click',function(){
      var ok=true;
      try{ok=window.confirm(x.tResetAsk.replace('{p}',tsel))}catch(e){}
      if(!ok)return;
      delete players[tsel].prog;delete players[tsel].hist;delete players[tsel].cap;
      store.set(players);renderTeacher();
    });
    body.appendChild(rs);
  }
  function openTeacher(){stopListening(true);stopVoice();show('teacher');renderTeacher()}
  function closeTeacher(){show(state.name?'menu':'welcome');openDrawer()}

  /* ---------- events ---------- */
  $('#nameForm').addEventListener('submit',function(e){
    e.preventDefault();
    var n=$('#nameInput').value.trim().replace(/\s+/g,' ');
    if(!n)return;
    login(n);
  });
  $('#changePlayer').addEventListener('click',function(){
    closeDrawer();$('#nameInput').value='';paintPlayers();show('welcome');
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click',function(){
      lang=b.getAttribute('data-lang');
      stopListening(true);
      try{localStorage.setItem('nooyesss:lang',lang)}catch(e){}
      applyLang();
    });
  });
  $('#backBtn').addEventListener('click',toGames);
  $('#menuBtn').addEventListener('click',toGames);
  $('#againBtn').addEventListener('click',function(){stopVoice();startTopic(state.topic)});
  $('#speakBtn').addEventListener('click',readQuestion);
  $('#micBtn').addEventListener('click',function(){if(listening)stopListening(true);else beginListening()});
  $('#nextBtn').addEventListener('click',goNext);
  $('#muteBtn').addEventListener('click',function(){
    muted=!muted;
    try{localStorage.setItem('nooyesss:muted',muted?'1':'0')}catch(e){}
    if(muted)stopVoice();
    paintMute();
  });
  $('#recOpenM').addEventListener('click',openRecord);
  $('#recBack').addEventListener('click',closeRecord);
  $('#tOpenM').addEventListener('click',openTeacher);
  $('#tBack').addEventListener('click',closeTeacher);

  $('#tapOpen').addEventListener('click',openTap);
  $('#gamesOpen').addEventListener('click',function(){stopVoice();show('games')});
  $('#gamesBack').addEventListener('click',function(){stopVoice();show('menu')});
  $('#menuToggle').addEventListener('click',openGate);
  $('#drawerClose').addEventListener('click',closeDrawer);
  $('#scrim').addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
  $('#gateBack').addEventListener('click',leaveGrown);
  $('#gateForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(parseInt($('#gateInput').value,10)===gateAns){openGrown()}
    else{$('#gateMsg').textContent=T().gateWrong;$('#gateMsg').hidden=false;$('#gateInput').value=''}
  });
  $('#tapGuest').addEventListener('click',function(){login(T().guestName);openTap()});
  $('#tapBack').addEventListener('click',leaveTap);
  $('#tapHome').addEventListener('click',showTapPick);
  $('#tapAgain').addEventListener('click',function(){stopVoice();startTap(tap.cat)});
  $('#tapCard').addEventListener('click',onTapCard);
  window.NY=function(){return {state:state,players:players,store:store,TXT:TXT,TOPICS:TOPICS,TAPCATS:TAPCATS,TAPLISTS:TAPLISTS,
    mk:mk,shuffle:shuffle,pickOne:pickOne,byTier:byTier,L:L,T:T,lang:function(){return lang},say:say,show:show,cheer:cheer,
    confetti:confetti,tone:tone,sparkle:sparkle,optKey:optKey,applyLang:applyLang,stopVoice:stopVoice}};
  applyLang();
  openDB(function(){loadClips(function(){if(!$('#record').hidden)renderRecord()})});
})();
</script>
